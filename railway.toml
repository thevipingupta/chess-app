# Railway deployment config — chess-app
# Uses Dockerfile for full build control (nixpacks is skipped when Dockerfile exists)
#
# Required env vars to set in Railway dashboard:
#   SECRET_KEY        = any long random string
#   FRONTEND_ORIGIN   = https://<your-app>.up.railway.app  (set after first deploy)
#   STOCKFISH_PATH    = /usr/games/stockfish
#   DATABASE_URL      = (auto-set by Railway PostgreSQL plugin)

[deploy]
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
