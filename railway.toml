# Railway deployment config — chess-app
# Single service: FastAPI serves both the API and the built React frontend
#
# After first deploy, set these env vars in Railway dashboard:
#   SECRET_KEY        = any long random string
#   FRONTEND_ORIGIN   = https://<your-app>.up.railway.app
#   STOCKFISH_PATH    = /usr/games/stockfish
#   DATABASE_URL      = (auto-set by Railway PostgreSQL plugin)
#   VITE_API_URL      = (leave empty — frontend is served from same origin)

[build]
builder = "nixpacks"
buildCommand = "pip install uv && uv sync && cd frontend && npm install && npm run build"

[deploy]
startCommand = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
