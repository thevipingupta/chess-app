[project]
name = "chess-app"
version = "1.0.0"
description = "Online chess — play vs computer and solve puzzles"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-chess>=1.999",
    "stockfish>=3.28.0",
    "python-jose[cryptography]>=3.3.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.9",
    "pydantic[email]>=2.13.5",
    "bcrypt>=5.0.0",
    "psycopg2-binary>=2.9.0",  # PostgreSQL driver (used on Railway/Render; ignored for SQLite locally)
    "aiofiles>=23.0.0",        # required by FastAPI StaticFiles for serving built frontend
    "anthropic>=0.40.0",       # Claude Vision for OCR + handwriting correction
    "pymupdf>=1.24.0",         # PDF → image rendering (no system deps needed)
    "Pillow>=10.0.0",          # image normalisation before Vision API
]

[tool.ruff]
line-length = 100
target-version = "py310"
